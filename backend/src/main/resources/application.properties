spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fitbud}
spring.datasource.username=${DB_USERNAME:fitbud}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
server.error.include-stacktrace=never
fitbud.jwt.secret=${FITBUD_JWT_SECRET}
fitbud.jwt.expiration-ms=86400000
fitbud.usda.api-key=${USDA_API_KEY}
fitbud.usda.base-url=https://api.nal.usda.gov/fdc/v1