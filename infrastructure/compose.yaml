services:
  postgres:
    image: postgres:17
    container_name: fitbud-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: fitbud
      POSTGRES_USER: fitbud
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - fitbud-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitbud -d fitbud"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile

    container_name: fitbud-backend
    restart: unless-stopped

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fitbud
      SPRING_DATASOURCE_USERNAME: fitbud
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      FITBUD_JWT_SECRET: ${FITBUD_JWT_SECRET}
      USDA_API_KEY: ${USDA_API_KEY}
      FITBUD_FRONTEND_URL: ${FITBUD_FRONTEND_URL:-http://localhost:3000}

    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}

    container_name: fitbud-frontend
    restart: unless-stopped

    ports:
      - "3000:80"

    depends_on:
      - backend

volumes:
  fitbud-postgres-data:
    name: infrastructure_fitbud-postgres-data